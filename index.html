<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bus Survey</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="lib/papaparse.min.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=check,download,login,logout,person_check,share">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,100..900;1,100..900&display=swap');
    .material-symbols-outlined {
      font-variation-settings:
      'FILL' 0,
      'wght' 400,
      'GRAD' 0,
      'opsz' 24
    }
  </style>
  <style>
    *, *::before, *::after { box-sizing: inherit }

    [hidden] { display: none !important }

    :root {
      height: 100%;
    }

    body {
      margin: 0;
      height: 100%;
      padding: 1rem;
      gap: 2rem;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      background-color: black;
      color: #FFFFFF;
      font-family: "Libre Franklin", serif;
    }

    header {
      font-size: 2rem;
    }
    header > h1 {
      margin: 0;
      font-size: 1em;
    }
    footer {
      margin-top: auto;
    }

    main {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }
    fieldset {
      display: flex;
      flex-direction: column;
      gap: 2rem;
      margin: 0;
      padding: 1rem;
      border: 1px solid #333333;
      border-radius: 0.5rem;
      background-color: #111111;
    }
    fieldset:disabled {
      filter: grayscale() opacity(0.5);
    }

    button {
      width: 100%;
      padding: 1rem 0;
      border: none;
      border-radius: 0.5rem;
      background-color: #009ED7;
      font-size: 1.5rem;
      color: inherit;
      font-family: inherit;
    }
    button:disabled {
      filter: grayscale() opacity(0.5);
    }
    button:active {
      background-color: #005EA7;
    }
    button[type=submit] {
      background-color: #009E4D;
    }
    button[type=submit]:active {
      background-color: #005E1D;
    }

    .component-textinput {
      display: flex;
      flex-direction: column;
    }
    .component-textinput > label {
      font-size: 1.5rem;

      padding-bottom: 0.25rem;
      /* background-color: green; */
    }
    .component-textinput > input[type=text] {
      border: none;
      border-bottom: 2px solid #CCCCCC;
      background-color: #333333;
      color: currentColor;
      font-family: inherit;
      font-size: 2rem;
      padding: 1rem;
      width: 100%;
      font-weight: bold;
    }
    .component-textinput > input[type=text]:focus {
      border-bottom: 2px solid #009ED7;
    }
    .component-textinput > input[type=text]:valid {
      border-bottom: 2px solid #009E4D;
    }
    .component-textinput > input[type=text]:invalid {
      border-bottom: 2px solid #E4022D;
    }

    .component-radiogroup {
      display: flex;
      border: 1px solid currentColor;
      border-radius: 0.5rem;
      background-color: #333333;
      overflow: hidden;
    }
    .component-radiogroup > .component-radiogroup-radioitem {
      position: relative;
      display: flex;
      width: 100%;
    }
    .component-radiogroup > .component-radiogroup-radioitem > input[type=radio] {
      position: absolute;
      appearance: none;
    }
    .component-radiogroup > .component-radiogroup-radioitem > label {
      width: 100%;
      padding: 1rem 0;
      font-size: 1.5rem;
    }
    .component-radiogroup > .component-radiogroup-radioitem:not(:first-child) > label::before {
      content: "";
      position: absolute;
      display: inline-flex;
      width: 1px;
      background-color: currentColor;
      top: 0.5rem;
      bottom: 0.5rem;
    }
    .component-radiogroup > .component-radiogroup-radioitem > input[type=radio]:checked + label {
      background-color: #009ED7;
    }

    .component-textlabel {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.25em;
      line-height: 1;
    }
    .component-textlabel > .material-symbols-outlined {
      font-size: 1em;
    }

    .component-hflex {
      display: flex;
      gap: 1rem;
    }

    .component-metadata {
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2em;
    }

    #b-circle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0.25rem solid #FFFFFF;
      background-color: #009ED7;
      border-radius: 50%;
      width: 1.5em;
      height: 1.5em;
      font-size: 1em;
      font-weight: bold;
      line-height: 1;
    }
  </style>
</head>
<body>
  <header class="component-textlabel">
    <span id="b-circle">B</span>
    <h1>Bus Survey</h1>
  </header>
  <main>
    <form id="main" autocomplete="off">
      <fieldset>
        <div class="component-textinput">
          <label for="input-stopid">Bus Stop Identifier</label>
          <input id="input-stopid" type="text" name="stopid" placeholder="2000230" required>
        </div>
        <div class="component-textinput">
          <label for="input-author">Surveyor</label>
          <input id="input-author" type="text" name="author" placeholder="Joe Bloggs" required>
        </div>
        <div>
          <button type="submit" disabled>
            <span class="component-textlabel">
              <span class="material-symbols-outlined">person_check</span>
              <span class="text">Sign on</span>
            </span>
          </button>
        </div>
      </fieldset>
    </form>
    <form id="entry" autocomplete="off" hidden>
      <div class="component-metadata">
        <div>Bus Stop: <span id="fill-stopid"></span></div>
        <div>Surveyor: <span id="fill-author"></span></div>
      </div>
      <fieldset>
        <div class="component-radiogroup">
          <div class="component-radiogroup-radioitem">
            <input id="input-event-arrive" type="radio" name="event" value="arrive" required>
            <label for="input-event-arrive">
              <span class="component-textlabel">
                <span class="material-symbols-outlined">login</span>
                <span class="text">Arrived</span>
              </span>
            </label>
          </div>
          <div class="component-radiogroup-radioitem">
            <input id="input-event-depart" type="radio" name="event" value="depart" required>
            <label for="input-event-depart">
              <span class="component-textlabel">
                <span class="material-symbols-outlined">logout</span>
                <span class="text">Departed</span>
              </span>
            </label>
          </div>
        </div>
        <div class="component-textinput">
          <label for="input-route">Bus Route Identifier</label>
          <input id="input-route" type="text" name="route" placeholder="144, 610X, B1, ... " required>
        </div>
        <div>
          <button type="submit" disabled>
            <span class="component-textlabel">
              <span class="material-symbols-outlined">check</span>
              <span class="text">Submit</span>
            </span>
          </button>
        </div>
      </fieldset>
    </form>
  </main>
  <footer class="component-hflex">
    <button type="button" onclick="browserShare()">
      <span class="component-textlabel">
      <span class="material-symbols-outlined">share</span>
      Share
      </span>
    </button>
    <button type="button" onclick="browserDownload()">
      <span class="component-textlabel">
      <span class="material-symbols-outlined">download</span>
      Download
      </span>
    </button>
  </footer>
  <script>
    if (window.location.search === "?delete_all") {
      for (let i = 0; i < localStorage.length; ++i) {
        const key = localStorage.key(i);
        if (key.startsWith("buslog:") || key.startsWith("bus-survery:")) localStorage.removeItem(key);
      }
      window.location.replace(window.location.pathname);
    }

    const SCHEMA = ["stopid", "author", "event", "route", "timestamp"];
    const SCHEMA_VERSION = "0.0.1";

    const persisted = localStorage.getItem(`bus-survey:log-${SCHEMA_VERSION}`);
    const log = persisted !== null ? Papa.parse(persisted).data : [];

    const mainForm = document.getElementById("main");
    const entryForm = document.getElementById("entry");

    function submitButtonCheck(form) {
      for (const submit of form.querySelectorAll(`button[type=submit]`)) submit.disabled = !form.checkValidity();
    }

    function submitButtonValidator(form) {
      form.addEventListener("input", () => {
        submitButtonCheck(form);
      });
    }

    async function browserDownload() {
      const file = new File([Papa.unparse({ fields: SCHEMA, data: log })], "bus-survey.csv", { type: "text/csv" });
      const a = document.createElement("a");
      a.download = file.name;
      a.href = `data:${file.type},${encodeURIComponent(await file.text())}`;
      a.click();
    }

    async function browserShare() {
      const file = new File([Papa.unparse({ fields: SCHEMA, data: log })], "bus-survey.csv", { type: "text/csv" });
      try {
        await navigator.share({ files: [file] });
      } catch (e) {
        browserDownload(file);
      }
    }

    submitButtonValidator(mainForm);
    submitButtonValidator(entryForm);

    mainForm.addEventListener("submit", (ev) => {
      ev.preventDefault();
      const mainData = new FormData(mainForm);
      mainForm.hidden = true;
      document.getElementById("fill-stopid").textContent = mainData.get("stopid");
      document.getElementById("fill-author").textContent = mainData.get("author");
      entryForm.addEventListener("submit", (ev) => {
        ev.preventDefault();
        const entryData = new FormData(entryForm);
        const { stopid, author, event, route, timestamp } = {
          ...Object.fromEntries(mainData),
          ...Object.fromEntries(entryData),
          timestamp: new Date(),
        };
        console.log({ stopid, author, event, route, timestamp });
        log.push([stopid, author, event, route, timestamp]);
        localStorage.setItem(`bus-survey:log-${SCHEMA_VERSION}`, Papa.unparse(log));
        entryForm.reset();
        submitButtonCheck(entryForm);
      });
      entryForm.hidden = false;
    });
  </script>
</body>
</html>
