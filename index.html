<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bus Survey</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="lib/papaparse.min.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=block,bus_alert,check,check_circle,download,login,logout,person_check,share,timer">
  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24 }
  </style>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,100..900;1,100..900&display=swap');

    *, *::before, *::after { box-sizing: inherit }

    [hidden] { display: none !important }

    :root {
      height: 100%;
      --blu: #009ED7;
      --grn: #009E4D;
      --red: #E4022D;
      --ylw: #CB9A00;
    }

    .bg-grn { background-color: var(--grn) }
    .bg-blu { background-color: var(--blu) }
    .bg-red { background-color: var(--red) }
    .bg-ylw { background-color: var(--ylw) }

    body {
      margin: 0 auto;
      height: 100%;
      padding: 1rem;
      gap: 2rem;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      background-color: black;
      color: #FFFFFF;
      font-family: "Libre Franklin", serif;
      max-width: 800px;
    }

    header {
      font-size: 2rem;
    }
    header > h1 {
      margin: 0;
      font-size: 1em;
    }
    footer {
      margin-top: auto;
    }

    main {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    form {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }
    fieldset {
      display: flex;
      flex-direction: column;
      gap: 2rem;
      margin: 0;
      padding: 1rem;
      border: 1px solid #333333;
      border-radius: 0.5rem;
      background-color: #111111;
    }
    fieldset:disabled {
      filter: grayscale() opacity(0.5);
    }

    button {
      cursor: pointer;
      width: 100%;
      padding: 1rem 0;
      border: none;
      border-radius: 0.5rem;
      background-color: var(--blu);
      font-size: 1.5rem;
      color: inherit;
      font-family: inherit;
    }
    button:disabled {
      filter: grayscale() opacity(0.5);
      cursor: auto;
    }
    button:active {
      filter: brightness(0.5);
    }

    .component-textinput {
      display: flex;
      flex-direction: column;
    }
    .component-textinput > label {
      font-size: 1.5rem;
      padding-bottom: 0.25rem;
    }
    .component-textinput > input[type=text] {
      border: none;
      border-bottom: 2px solid #CCCCCC;
      background-color: #333333;
      color: #FFFFFF;
      font-family: inherit;
      font-size: 2rem;
      padding: 1rem;
      width: 100%;
      font-weight: bold;
    }
    .component-textinput > input[type=text]:focus {
      border-bottom: 2px solid var(--blu);
    }
    .component-textinput > input[type=text]:valid {
      border-bottom: 2px solid var(--grn);
    }
    .component-textinput > input[type=text]:invalid {
      border-bottom: 2px solid var(--red);
    }

    .component-radiogroup {
      display: flex;
      border: 1px solid #FFFFFF;
      border-radius: 0.5rem;
      background-color: #333333;
      overflow: hidden;
    }
    .component-radiogroup > .component-radiogroup-radioitem {
      position: relative;
      display: flex;
      width: 100%;
    }
    .component-radiogroup > .component-radiogroup-radioitem > input[type=radio] {
      position: absolute;
      appearance: none;
    }
    .component-radiogroup > .component-radiogroup-radioitem > label {
      width: 100%;
      padding: 1rem 0;
      font-size: 1rem;
      cursor: pointer;
    }
    .component-radiogroup > .component-radiogroup-radioitem:not(:first-child) > label::before {
      content: "";
      position: absolute;
      display: inline-flex;
      width: 1px;
      background-color: #FFFFFF;
      top: 0.5rem;
      bottom: 0.5rem;
    }
    .component-radiogroup > .component-radiogroup-radioitem > input[type=radio]:checked + label {
      background-color: var(--blu);
    }

    .component-textlabel {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.25em;
      line-height: 1;
    }
    .component-textlabel > .material-symbols-outlined {
      font-size: 1em;
    }

    .component-hflex {
      display: flex;
      gap: 1rem;
    }

    .component-metadata {
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2em;
    }

    #b-circle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0.25rem solid #FFFFFF;
      background-color: var(--blu);
      border-radius: 50%;
      width: 1.5em;
      height: 1.5em;
      font-size: 1em;
      font-weight: bold;
      line-height: 1;
    }

    .component-submitted {
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      position: absolute;
      content: "";
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      background-color: #0007;
    }
    .component-submitted > span {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 6rem;
      height: 6rem;
      font-size: 8rem;
      border-radius: 50%;
      background-color: var(--grn);
      color: #FFFFFF;
    }

    .component-checkbox {
      display: flex;
      flex-direction: row;
      align-items: center;
    }
    .component-checkbox > input[type=checkbox] {
      position: relative;
      appearance: none;
      margin: 0;
      width: 2rem;
      height: 2rem;
      align-self: flex-start;
      background-color: #333333;
      border: 1px solid #FFFFFF;
      border-radius: 0.5rem;
      cursor: pointer;
      font-family: inherit;
    }
    .component-checkbox > input[type=checkbox]:checked {
      background-color: var(--blu);
    }
    .component-checkbox > input[type=checkbox]:checked::after {
      content: "✔";
      position: absolute;
      display: flex;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      line-height: 1;
      color: #FFFFFF;
      font-weight: bold;
    }
    .component-checkbox > label {
      padding-left: 0.75rem;
      font-size: 1.5rem;
      cursor: pointer;
    }
    .component-checkbox > input[type=checkbox]:checked + * .text {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header class="component-textlabel">
    <span id="b-circle">B</span>
    <h1>Bus Survey</h1>
  </header>
  <main></main>
  <footer class="component-hflex">
    <button type="button" onclick="browserShare()">
      <span class="component-textlabel">
      <span class="material-symbols-outlined">share</span>
      Share
      </span>
    </button>
    <button type="button" onclick="browserDownload()">
      <span class="component-textlabel">
      <span class="material-symbols-outlined">download</span>
      Download
      </span>
    </button>
  </footer>
  <template>
    <form id="template-details" autocomplete="off" action="javascript:void(0)">
      <fieldset>
        <div class="component-textinput">
          <label for="input-stopid">Bus Stop Identifier</label>
          <input id="input-stopid" type="text" name="stopid" placeholder="2000230" required>
        </div>
        <div class="component-textinput">
          <label for="input-author">Surveyor</label>
          <input id="input-author" type="text" name="author" placeholder="Joe Bloggs" required>
        </div>
        <div style="margin-top: 2rem;">
          <button type="submit" class="bg-grn" disabled>
            <span class="component-textlabel">
              <span class="material-symbols-outlined">person_check</span>
              <span class="text">Sign on</span>
            </span>
          </button>
        </div>
        <div>
          <p><span style="color: var(--blu)">*</span>Once you "Sign on", GPS will activate temporarily every 30 minutes to note the bus stop's location.</p>
        </div>
      </fieldset>
    </form>
    <form id="template-collection" autocomplete="off" action="javascript:void(0)">
      <div class="component-metadata">
        <div>Bus Stop: <span id="slot-stopid"></span></div>
        <div>Surveyor: <span id="slot-author"></span></div>
      </div>
      <fieldset>
        <div class="component-radiogroup">
          <div class="component-radiogroup-radioitem">
            <input id="input-event-arrive" type="radio" name="event" value="arrive" required>
            <label for="input-event-arrive">
              <span class="component-textlabel">
                <span class="material-symbols-outlined">login</span>
                <span class="text">Arriving</span>
              </span>
            </label>
          </div>
          <div class="component-radiogroup-radioitem">
            <input id="input-event-depart" type="radio" name="event" value="depart" required>
            <label for="input-event-depart">
              <span class="component-textlabel">
                <span class="material-symbols-outlined">logout</span>
                <span class="text">Departing</span>
              </span>
            </label>
          </div>
          <div class="component-radiogroup-radioitem">
            <input id="input-event-skip" type="radio" name="event" value="skip" required>
            <label for="input-event-skip">
              <span class="component-textlabel">
                <span class="material-symbols-outlined">block</span>
                <span class="text">Skipped</span>
              </span>
            </label>
          </div>
        </div>
        <div class="component-textinput">
          <label for="input-route">Bus Route Identifier</label>
          <input id="input-route" type="text" name="route" placeholder="144, 610X, B1, ... " required>
        </div>
        <fieldset>
          <legend>Observations</legend>
          <div class="component-checkbox">
            <input id="input-check-congestion" type="checkbox" name="congestion" value="1">
            <label for="input-check-congestion">
              <span class="component-textlabel">
                <span class="text">Traffic Congestion</span>
              </span>
            </label>
          </div>
        </fieldset>
        <div style="margin-top: 2rem;">
          <button type="submit" class="bg-grn" disabled>
            <span class="component-textlabel">
              <span class="material-symbols-outlined">check</span>
              <span class="text">Submit</span>
            </span>
          </button>
        </div>
      </fieldset>
      <div class="component-submitted" hidden><span class="material-symbols-outlined">check_circle</span></div>
    </form>
  </template>
  <script>
    if (window.location.search === "?delete_all") {
      for (let i = 0; i < localStorage.length; ++i) {
        const key = localStorage.key(i);
        if (key.startsWith("buslog:") || key.startsWith("bus-survery:")) localStorage.removeItem(key);
      }
      window.location.replace(window.location.pathname);
    }

    const SCHEMA = ["stopid", "author", "event", "route", "timestamp", "location", "congestion"];
    const SCHEMA_VERSION = "0.0.1";

    const persisted = localStorage.getItem(`bus-survey:log-${SCHEMA_VERSION}`);
    const log = persisted !== null ? Papa.parse(persisted).data : [];

    /**
     * @param {HTMLElement} template
     * @param {string} contentSelector
     * @returns {HTMLElement}
    */
    function importTemplate(template, contentSelector, slots = {}) {
      const root = document.importNode(template.content.querySelector(contentSelector), true);
      root.removeAttribute("id");
      for (const [slotSelector, content] of Object.entries(slots)) {
        const slot = root.querySelector(slotSelector);
        if (slot === null) continue;
        slot.replaceChildren(content);
        slot.removeAttribute("id");
      }
      return root;
    }

    /** @param {HTMLFormElement} form */
    function bindSubmitComponent(form) {
      const update = () => {
        form.querySelectorAll(`button[type=submit]`).forEach(btn => {
          btn.disabled = !form.checkValidity();
        });
      };
      form.addEventListener("input", update);
      form.addEventListener("reset", () => setTimeout(update, 0));
      return form;
    }

    /**
     * @param {HTMLFormElement} form
     * @returns {FormData}
    */
    async function submissionOf(form) {
      return await new Promise((resolve) => {
        const onSubmit = (ev) => {
          ev.preventDefault();
          form.removeEventListener("submit", onSubmit);
          resolve(new FormData(form, ev.submitter));
          form.reset();
          form.querySelectorAll(".component-submitted").forEach(el => el.hidden = false);
          setTimeout(() => { form.querySelectorAll(".component-submitted").forEach(el => el.hidden = true); }, 500);
        };
        form.addEventListener("submit", onSubmit);
      });
    }

    function save() {
      const now = new Date();
      const name = `bus-survey-${now.getFullYear()}-${(1+now.getMonth()).toString().padStart(2, "0")}-${now.getDate().toString().padStart(2, "0")}.csv`;
      return new File([Papa.unparse([SCHEMA].concat(log))], name, { type: "text/csv" });
    }

    async function browserDownload() {
      const file = save();
      const a = document.createElement("a");
      a.download = file.name;
      a.href = `data:${file.type},${encodeURIComponent(await file.text())}`;
      a.click();
    }

    async function browserShare() {
      await navigator.share({ files: [save()] }).catch(() => browserDownload());
    }

    globalThis.GPS = (() => {
      let _position = null;
      let _timeout = 1 * 60 * 1000;
      let _active = false;
      const refresh = () => {
        let nReports = 0;
        let initialTimeoutId = null;
        let locateTimeoutId = null;
        if (_active) return false;
        else _active = true;
        try {
          const watchId = navigator.geolocation.watchPosition(
            (position) => {
              if (initialTimeoutId !== null) {
                clearTimeout(initialTimeoutId);
                initialTimeoutId = null
              }
              if (locateTimeoutId === null) {
                locateTimeoutId = setTimeout(() => {
                  locateTimeoutId = null;
                  navigator.geolocation.clearWatch(watchId);
                  _active = false;
                  if (_position === null) setTimeout(refresh, 5 * _timeout);
                }, _timeout);
              }
              if (nReports >= 5) {
                clearTimeout(locateTimeoutId);
                navigator.geolocation.clearWatch(watchId);
                _active = false;
              }
              if (position.coords.accuracy <= 200) {
                if (
                  _position === null
                  || (
                    _position !== null
                    && position.coords.accuracy <= _position.r95
                  )
                ) {
                  ++nReports;
                  _position = {
                    lon: parseFloat(position.coords.longitude.toFixed(6)),
                    lat: parseFloat(position.coords.latitude.toFixed(6)),
                    r95: position.coords.accuracy,
                    t: new Date(position.timestamp),
                  };
                  globalThis.GPS.onPosition?.(_position);
                }
              }
            },
            null,
            { enableHighAccuracy: true, maximumAge: 0 },
          );
          initialTimeoutId = setTimeout(() => {
            navigator.geolocation.clearWatch(watchId);
            _active = false;
            initialTimeoutId = null;
          }, _timeout);
        } catch (error) {
          clearTimeout(initialTimeoutId);
          clearTimeout(locateTimeoutId);
          try {
            navigator.geolocation.clearWatch(watchId);
            _active = false;
          } catch (error) {}
        }
        return true;
      };
      const last = () => {
        if (_position === null) refresh();
        return _position;
      };
      const isActive = () => _active;
      return { refresh, last, isActive };
    })();

    (async () => {
      const main = document.querySelector("main");
      const template = document.querySelector("template");

      const detailsForm = bindSubmitComponent(importTemplate(template, "#template-details"));
      main.replaceChildren(detailsForm);
      const { stopid, author } = Object.fromEntries(await submissionOf(detailsForm));
      GPS.onPosition = (gps) => {
        log.push([stopid, author, "gps", "", new Date().toJSON(), `geo:${gps.lat},${gps.lon};u=${gps.r95}`]);
      };
      GPS.refresh();
      setInterval(() => { GPS.refresh() }, 30 * 60 * 1000);

      const collectionForm = bindSubmitComponent(importTemplate(template, "#template-collection", {
        "#slot-stopid": stopid,
        "#slot-author": author,
      }));
      main.replaceChildren(collectionForm);
      while (true) {
        const { event, route, congestion } = Object.fromEntries(await submissionOf(collectionForm));
        const timestamp = new Date();
        console.log({ stopid, author, event, route, timestamp, congestion });
        log.push([stopid, author, event, route, timestamp.toJSON(), "", congestion]);
        localStorage.setItem(`bus-survey:log-${SCHEMA_VERSION}`, Papa.unparse(log));
      }
    })();
  </script>
</body>
</html>
